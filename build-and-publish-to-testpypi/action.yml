name: Build uv package and Publish to TestPyPI
description: uv パッケージを ./dist にビルドし、TestPyPI に公開します

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1

    - name: Build package
      uses: heiwa4126/reusable-workflows/build-uv-package@v0.0.0

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
      with:
        repository-url: https://test.pypi.org/legacy/
        # attestations: true  # PEP740 attestations (enabled by default)
