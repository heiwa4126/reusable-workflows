name: Build uv package
description: |
  uv パッケージを ./dist にビルドします。
  タスクランナーとして PoeThePoet を使用し、
  `poe build` でパッケージが `./dist` にビルドできることを想定。
  ビルドに使う Python バージョンは .python-version に従います。

inputs:
  checkout:
    description: |
      リポジトリをチェックアウトするかどうか
    required: false
    default: "false"
  # repository-url:
  #   description: |
  #     発行先のリポジトリ URL。省略時は
  #     か TestPyPI(https://test.pypi.org/legacy/) を指定
  #   required: false
  #   default: 'https://test.pypi.org/legacy/'

runs:
  using: composite
  steps:
    - name: Checkout repository
      if: inputs.checkout == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true

    - name: Audit dependencies
      shell: bash
      run: uvx uv-secure ./uv.lock

    - name: Set up Python (uv respects ./.python-version)
      shell: bash
      run: uv python install

    - name: "INFO: Python and uv version"
      shell: bash
      run: |
        echo "::group::Show Python and uv version"
        uv run python --version
        uv --version
        echo "::endgroup::"

    - name: Build distribution packages
      shell: bash
      run: uv run poe build

    # 変な Docker イメージを読みに行こうとするので共有できない
    # - name: Publish
    #   uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
