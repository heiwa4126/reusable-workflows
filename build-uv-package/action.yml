name: Build uv package
description: パッケージを ./dist にビルドします

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
      with:
        enable-cache: true

    - name: Audit dependencies
      shell: bash
      run: uvx uv-secure ./uv.lock

    - name: Set up Python (uv respects ./.python-version)
      shell: bash
      run: uv python install

    - name: "INFO: Python and uv version"
      shell: bash
      run: |
        echo "::group::Show Python and uv version"
        uv run python --version
        uv --version
        echo "::endgroup::"

    - name: Build distribution packages
      shell: bash
      run: uv run poe build
