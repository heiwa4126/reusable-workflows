name: Build and Publish to TestPyPI

on:
  workflow_call:
  # push:
  #   tags:
  #     # Test release tags for TestPyPI validation
  #     - test-*

concurrency:
  group: publish-testpypi-reusable-workflows${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    # if: github.repository_owner == github.actor
    # environment: testpypi
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for Trusted Publishing
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Build package
        # uses: ./.github/actions/build-uv-package
        uses: heiwa4126/reusable-workflows/.github/actions/build-uv-package@v0.0.0

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          # attestations: true  # PEP740 attestations (enabled by default)
